name: Facet
options:
  developmentLanguage: en
  knownRegions: [en, ja, zh-Hans, zh-Hant, ko, fr, de, es, es-419, pt-BR, pt-PT, it]
  bundleIdPrefix: st.rio
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "5"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  FacetCore:
    path: .
targets:
  Facet:
    type: application
    platform: iOS
    sources:
      - Apps/iOS
      - Apps/Shared
    dependencies:
      - package: FacetCore
      - target: FacetWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: st.rio.facet
        PRODUCT_NAME: Facet
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_KEY_CFBundleDisplayName: Facet – Contact QR
        INFOPLIST_KEY_NSContactsUsageDescription: Facet uses only the fields you select from your contact to create QR codes for sharing.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  FacetWatch:
    type: application
    platform: watchOS
    sources:
      - Apps/Watch
      - Apps/Shared
    dependencies:
      - package: FacetCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: st.rio.facet.watchkitapp
        PRODUCT_NAME: FacetWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Facet
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: st.rio.facet
        INFOPLIST_KEY_WKWatchKitApp: YES
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        SKIP_INSTALL: YES
  FacetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: Tests/FacetUITests
    dependencies:
      - target: Facet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: st.rio.facet.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Facet:
    build:
      targets:
        Facet: all
    test:
      targets:
        - name: FacetUITests
          skippedTests:
            - FacetContactsUITests
            - FacetStoreScreenshotTests
  FacetContactsTests:
    build:
      targets:
        Facet: all
    test:
      targets:
        - name: FacetUITests
          selectedTests:
            - FacetContactsUITests
  FacetWatch:
    build:
      targets:
        FacetWatch: all
  FacetStoreScreenshots:
    build:
      targets:
        Facet: all
    test:
      targets:
        - name: FacetUITests
          selectedTests:
            - FacetStoreScreenshotTests
